spring.application.name=odontologia

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.persistent=false
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=ODONTOLOGIA_SESSION
server.servlet.session.cookie.path=/api/odontologo
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${server.ssl.enabled:false}

app.base-url=${APP_BASE_URL:}
app.time-zone=${APP_TIME_ZONE:}
app.consultorio-nombre=${APP_CONSULTORIO_NOMBRE:}
app.odontologo-nombre=${APP_ODONTOLOGO_NOMBRE:}
app.dentist-credential-file=${APP_DENTIST_CREDENTIAL_FILE:}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.schema=public
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=5

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
